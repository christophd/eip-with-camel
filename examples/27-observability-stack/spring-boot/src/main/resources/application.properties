spring.application.name=eip-observability-stack

# Kafka broker
kafka.brokers=localhost:9092

# Server port
server.port=8087

# ── OpenTelemetry ────────────────────────────────────────────────────────────
# Traces and logs leave over OTLP gRPC on 4317.
otel.exporter.otlp.endpoint=http://localhost:4317
otel.exporter.otlp.protocol=grpc
otel.service.name=eip-observability-stack
otel.traces.exporter=otlp
otel.logs.exporter=otlp
# Micrometer owns metrics here (see below), so the OTel SDK's own metric
# exporter is off to avoid publishing two overlapping sets of the same data.
otel.metrics.exporter=none

camel.opentelemetry2.enabled=true
camel.opentelemetry2.exclude-patterns=timer:*

# ── Metrics ──────────────────────────────────────────────────────────────────
# Camel registers its route meters through Micrometer, so the Micrometer OTLP
# registry is what carries camel_* to the collector. Note this speaks OTLP over
# HTTP, so it is port 4318 — not the 4317 used for traces above.
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.otlp.metrics.export.step=10s
# Cumulative is what PromQL's rate() expects. Delta temporality would export
# per-interval increments and quietly give you wrong rates.
management.otlp.metrics.export.aggregation-temporality=cumulative

# Camel REST via servlet
camel.rest.context-path=/api

# Actuator — expose health, metrics, and Prometheus scrape endpoint
management.endpoints.web.exposure.include=health,metrics,prometheus

# Logging
logging.level.org.apache.camel=INFO
logging.level.com.example.eip=DEBUG
