name: Integration Tests

on:
  push:
    paths:
      - 'examples/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'examples/**'
      - '.github/workflows/tests.yml'

jobs:
  quarkus:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example:
          - 04-channel-types
          - 05-reliability
          - 06-channel-infra
          - 07-message-types
          - 08-message-metadata
          - 09-routing-fundamentals
          - 10-composed-routing
          - 11-advanced-routing
          - 12-transformation
          - 13-aggregator
      fail-fast: false
    name: Quarkus — ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Determine Docker images
        id: docker-images
        run: |
          COMPOSE_FILE="examples/${{ matrix.example }}/quarkus/src/test/resources/_infra/compose.yaml"
          IMAGES=$(grep 'image:' "$COMPOSE_FILE" | sed 's/.*image:[[:space:]]*//' | tr '\n' ' ')
          COMPOSE_HASH=$(sha256sum "$COMPOSE_FILE" | cut -c1-16)
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "compose-hash=$COMPOSE_HASH" >> "$GITHUB_OUTPUT"
          echo "week=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images.tar.gz
          key: docker-${{ matrix.example }}-${{ steps.docker-images.outputs.compose-hash }}-${{ steps.docker-images.outputs.week }}
          restore-keys: |
            docker-${{ matrix.example }}-${{ steps.docker-images.outputs.compose-hash }}-
      - name: Load or pull Docker images
        run: |
          if [ -f /tmp/docker-images.tar.gz ]; then
            echo "Loading Docker images from cache..."
            gunzip -c /tmp/docker-images.tar.gz | docker load
          fi
          NEEDS_SAVE=false
          for img in ${{ steps.docker-images.outputs.images }}; do
            if ! docker image inspect "$img" > /dev/null 2>&1; then
              echo "Pulling $img..."
              docker pull "$img"
              NEEDS_SAVE=true
            fi
          done
          if [ "$NEEDS_SAVE" = true ] || [ ! -f /tmp/docker-images.tar.gz ]; then
            echo "Saving Docker images to cache..."
            docker save ${{ steps.docker-images.outputs.images }} | gzip > /tmp/docker-images.tar.gz
          fi
      - name: Run tests
        run: |
          mvn -B --no-transfer-progress verify -f examples/${{ matrix.example }}/quarkus

  spring-boot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example:
          - 04-channel-types
          - 05-reliability
          - 06-channel-infra
          - 07-message-types
          - 08-message-metadata
          - 09-routing-fundamentals
          - 10-composed-routing
          - 11-advanced-routing
          - 12-transformation
          - 13-aggregator
      fail-fast: false
    name: Spring Boot — ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Determine Docker images
        id: docker-images
        run: |
          COMPOSE_FILE="examples/${{ matrix.example }}/spring-boot/src/test/resources/_infra/compose.yaml"
          IMAGES=$(grep 'image:' "$COMPOSE_FILE" | sed 's/.*image:[[:space:]]*//' | tr '\n' ' ')
          COMPOSE_HASH=$(sha256sum "$COMPOSE_FILE" | cut -c1-16)
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "compose-hash=$COMPOSE_HASH" >> "$GITHUB_OUTPUT"
          echo "week=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images.tar.gz
          key: docker-${{ matrix.example }}-${{ steps.docker-images.outputs.compose-hash }}-${{ steps.docker-images.outputs.week }}
          restore-keys: |
            docker-${{ matrix.example }}-${{ steps.docker-images.outputs.compose-hash }}-
      - name: Load or pull Docker images
        run: |
          if [ -f /tmp/docker-images.tar.gz ]; then
            echo "Loading Docker images from cache..."
            gunzip -c /tmp/docker-images.tar.gz | docker load
          fi
          NEEDS_SAVE=false
          for img in ${{ steps.docker-images.outputs.images }}; do
            if ! docker image inspect "$img" > /dev/null 2>&1; then
              echo "Pulling $img..."
              docker pull "$img"
              NEEDS_SAVE=true
            fi
          done
          if [ "$NEEDS_SAVE" = true ] || [ ! -f /tmp/docker-images.tar.gz ]; then
            echo "Saving Docker images to cache..."
            docker save ${{ steps.docker-images.outputs.images }} | gzip > /tmp/docker-images.tar.gz
          fi
      - name: Run tests
        run: |
          mvn -B --no-transfer-progress verify -f examples/${{ matrix.example }}/spring-boot

  yaml-dsl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example:
          - 04-channel-types
          - 06-channel-infra
          - 07-message-types
          - 08-message-metadata
          - 09-routing-fundamentals
          - 11-advanced-routing
      fail-fast: false
    name: YAML DSL — ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache SDKMAN and JBang
        id: cache-sdkman
        uses: actions/cache@v4
        with:
          path: ~/.sdkman
          key: ${{ runner.os }}-sdkman-jbang
      - name: Install JBang
        if: steps.cache-sdkman.outputs.cache-hit != 'true'
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "/home/runner/.sdkman/bin/sdkman-init.sh"
          sdk install jbang
      - name: Setup JBang
        run: |
          source "/home/runner/.sdkman/bin/sdkman-init.sh"
          jbang --version

          jbang trust add https://github.com/citrusframework/citrus/
          jbang trust add https://github.com/apache/camel/

          jbang citrus@citrusframework/citrus --version
          jbang camel@apache/camel --version
      - name: Determine Docker images
        id: docker-images
        run: |
          COMPOSE_FILE="examples/${{ matrix.example }}/yaml-dsl/test/_infra/compose.yaml"
          IMAGES=$(grep 'image:' "$COMPOSE_FILE" | sed 's/.*image:[[:space:]]*//' | tr '\n' ' ')
          COMPOSE_HASH=$(sha256sum "$COMPOSE_FILE" | cut -c1-16)
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "compose-hash=$COMPOSE_HASH" >> "$GITHUB_OUTPUT"
          echo "week=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images.tar.gz
          key: docker-${{ matrix.example }}-${{ steps.docker-images.outputs.compose-hash }}-${{ steps.docker-images.outputs.week }}
          restore-keys: |
            docker-${{ matrix.example }}-${{ steps.docker-images.outputs.compose-hash }}-
      - name: Load or pull Docker images
        run: |
          if [ -f /tmp/docker-images.tar.gz ]; then
            echo "Loading Docker images from cache..."
            gunzip -c /tmp/docker-images.tar.gz | docker load
          fi
          NEEDS_SAVE=false
          for img in ${{ steps.docker-images.outputs.images }}; do
            if ! docker image inspect "$img" > /dev/null 2>&1; then
              echo "Pulling $img..."
              docker pull "$img"
              NEEDS_SAVE=true
            fi
          done
          if [ "$NEEDS_SAVE" = true ] || [ ! -f /tmp/docker-images.tar.gz ]; then
            echo "Saving Docker images to cache..."
            docker save ${{ steps.docker-images.outputs.images }} | gzip > /tmp/docker-images.tar.gz
          fi
      - name: Run tests
        env:
          CITRUS_CAMEL_JBANG_DUMP_INTEGRATION_OUTPUT: "true"
          CITRUS_TESTCONTAINERS_REGISTRY_MIRROR_ENABLED: "true"
          CITRUS_TESTCONTAINERS_REGISTRY_MIRROR: "mirror.gcr.io"
        run: |
          source "/home/runner/.sdkman/bin/sdkman-init.sh"
          jbang citrus@citrusframework/citrus run examples/${{ matrix.example }}/yaml-dsl/test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yaml-dsl-dumps-${{ matrix.example }}
          include-hidden-files: true
          path: |
            **/.citrus-jbang/*-output.txt
