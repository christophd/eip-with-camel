# LLM Provider — Ollama. Read by AgentConfig, which builds the ChatModel
# directly; the langchain4j Ollama Spring Boot starter is not Spring Boot 4
# compatible.
ollama.model-name=qwen2.5:3b
ollama.base-url=http://localhost:11434

# Server
server.port=8088

# Camel REST

# Embedded MCP server — publishes ai-tool routes to external MCP clients.
# Exposure is opt-in per tag: with no tags set nothing is published, and the
# untagged default pool is never published.
camel.mcp-server.enabled=true
camel.mcp-server.tags=shipping
