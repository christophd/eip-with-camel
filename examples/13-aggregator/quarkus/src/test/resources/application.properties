kafka.brokers=localhost:9092

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/eipdb
quarkus.datasource.username=eipuser
quarkus.datasource.password=eippass

camel.main.shutdownTimeout=0
camel.component.kafka.shutdownTimeout=0

# citrus-camel puts camel-management on the test classpath, which turns on
# JMX without the camel-quarkus-management extension that configures it.
camel.main.jmx-enabled=false
