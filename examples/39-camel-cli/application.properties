# Kafka
camel.component.kafka.brokers=localhost:9092
camel.component.kafka.group-id=eip-cli-demo

# Redis
redis.host=localhost
redis.port=6379

# REST. The embedded HTTP server port is a CLI flag, not a property:
#   camel run --port=8088 *.yaml
# No rest binding-mode: the routes unmarshal explicitly, and enabling it
# too would convert the body twice (the second unmarshal then receives a
# Map where it expects an InputStream).
