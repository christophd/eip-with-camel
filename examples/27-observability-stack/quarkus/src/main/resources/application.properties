quarkus.application.name=eip-observability-stack

kafka.brokers=localhost:9092

quarkus.http.port=8087

# OpenTelemetry — all three signals go to the collector over OTLP
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.exporter.otlp.protocol=grpc
camel.opentelemetry.enabled=true
camel.opentelemetry.exclude-patterns=timer:*

# Traces, metrics and logs are all enabled by the micrometer-opentelemetry
# bridge, but be explicit so it is obvious what this example emits.
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true

# The default metric export interval is 1 minute, which is far too long to sit
# and watch during a tutorial. Ten seconds makes the dashboards move.
quarkus.otel.metric.export.interval=10s

# Camel registers its route meters through Micrometer; the bridge forwards them.
quarkus.micrometer.binder.jvm=true

# Logging
quarkus.log.category."org.apache.camel".level=INFO
quarkus.log.category."com.example.eip".level=DEBUG

quarkus.kafka.devservices.enabled=false
