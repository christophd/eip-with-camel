# Disable the demo data generators - tests will produce test data
eip.demo.data.generator.enabled=false
eip.pulsar.demo.data.generator.enabled=false
eip.redis.demo.data.generator.enabled=false

# Immediate Camel context shutdown to save some time waiting for inflight messages to complete
camel.springboot.shutdownTimeout=0
camel.component.kafka.shutdownTimeout=0

# Broker connections
kafka.brokers=localhost:9092
camel.component.pulsar.service-url=pulsar://localhost:6650

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
