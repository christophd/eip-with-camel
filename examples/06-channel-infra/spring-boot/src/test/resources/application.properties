# Disable demo data generator during tests
eip.demo.data.generator.enabled=false

# Immediate Camel context shutdown to save some time waiting for inflight messages to complete
camel.main.shutdownTimeout=0
camel.component.kafka.shutdownTimeout=0

# Camel servlet mapping
camel.servlet.mapping.enabled = true
camel.servlet.mapping.context-path = /api/*

# Kafka broker
kafka.brokers=localhost:9092
camel.component.pulsar.service-url=pulsar://localhost:6650

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/eipdb
spring.datasource.username=eipuser
spring.datasource.password=eippass
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=8082
