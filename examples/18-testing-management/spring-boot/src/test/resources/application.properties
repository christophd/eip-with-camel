kafka.brokers=localhost:9092

server.port=8082

# Smart Proxy pattern — mock | production
payment.gateway.mode=mock

# Disable background data generators during tests
eip.demo.data.generator.enabled=false
eip.test.message.injector.enabled=false

camel.main.shutdownTimeout=0
camel.component.kafka.shutdownTimeout=0

# Camel servlet mapping
camel.servlet.mapping.enabled = true
camel.servlet.mapping.context-path = /payments/*
