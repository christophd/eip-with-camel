spring.application.name=eip-loan-broker

# Kafka broker
kafka.brokers=localhost:9092

# Logging
logging.level.org.apache.camel=INFO
logging.level.com.example.eip=DEBUG

# Server port — avoid conflict with Pulsar admin on 8080
server.port=8082

# Camel REST (platform-http). camel-servlet defaulted to a /camel/* mapping,
# so this keeps the endpoint at /camel/api/loans rather than moving it.
camel.rest.context-path=/camel
